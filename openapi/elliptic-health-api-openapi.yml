openapi: 3.2.0
info:
  title: AI Health API
  description: API for AI-powered customer analysis, wallet and transaction screening analysis
  version: 0.0.1
servers:
- url: https://ai-api.elliptic.co
  description: Production server
security:
- Bearer: []
- apiKey: []
  signature: []
  timestamp: []
tags:
- name: Health
  description: Health check endpoints
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check
      description: Returns OK if the service is running
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: OK
components:
  securitySchemes:
    Bearer:
      description: Bearer Authentication
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      description: API Key
      type: apiKey
      in: header
      name: x-access-key
    signature:
      description: (Request Time, HTTP Method, Lowercase Path, Request Payload) signed with API Secret
      type: apiKey
      in: header
      name: x-access-sign
    timestamp:
      type: apiKey
      in: header
      name: x-access-timestamp
x-readme:
  explorer-enabled: true
